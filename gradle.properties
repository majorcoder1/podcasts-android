org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
ksp.incremental=true

# AGP 9 bundles its own Kotlin support, but KSP cannot work with it, and
# Room and Hilt both generate code through KSP. Opt out and keep applying
# the standalone Kotlin plugin.
android.builtInKotlin=false
# AGP 9's new DSL is on by default and the standalone Kotlin plugin cannot
# use it. Since KSP forces us onto that plugin, opt out of the new DSL too.
# Both flags go away when KSP supports AGP's built-in Kotlin.
android.newDsl=false
